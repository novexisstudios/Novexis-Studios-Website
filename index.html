  <style>
    body {
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #050505;
      color: #ffffff;
      overflow-x: hidden;
      margin: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .font-heading {
      font-family: "Space Grotesk", sans-serif;
      letter-spacing: -0.03em;
    }

    .font-accent {
      font-family: "Outfit", sans-serif;
    }

    .glass {
      background: rgba(10, 10, 10, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    #star-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 75vh;
      z-index: 1;
      background: radial-gradient(circle at top, #0a0a1a 0%, #000000 100%);
      overflow: hidden;
      pointer-events: none;
      -webkit-mask-image: linear-gradient(to bottom,
          black 0%,
          transparent 100%);
      mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.5;
      animation: twinkle var(--duration) infinite ease-in-out;
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: 0.2;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.4);
      }
    }

    #root {
      position: relative;
      z-index: 10;
      background: transparent;
    }
  </style>

  <script type="importmap">
      {
        "imports": {
          "framer-motion": "https://esm.sh/framer-motion@^12.29.2",
          "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
          "react/": "https://esm.sh/react@^19.2.4/",
          "react": "https://esm.sh/react@^19.2.4",

          "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
          "@react-three/drei": "https://esm.sh/@react-three/drei@^10.7.7"
        }
      }
    </script>
</head>

<body>
  <div id="star-container"></div>
  <div id="root"></div>
  <script>
    const container = document.getElementById("star-container");
    const starCount = 200; // Slightly reduced for performance
    for (let i = 0; i < starCount; i++) {
      const star = document.createElement("div");
      star.className = "star";
      const size = Math.random() * 2 + 0.5;
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.left = `${Math.random() * 100}%`;
      star.style.top = `${Math.random() * 100}%`;
      star.style.setProperty("--duration", `${Math.random() * 3 + 2}s`);
      star.style.animationDelay = `${Math.random() * 5}s`;
      container.appendChild(star);
    }
  </script>
  <script type="module" src="/index.tsx"></script>
</body>
